function saveCloudCfg(){localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(cloudCfg))}
function getDeviceId(){let x=localStorage.getItem(DEVICE_KEY);if(!x){x='device-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);localStorage.setItem(DEVICE_KEY,x)}return x}
function getGhToken(){return sessionStorage.getItem(GH_TOKEN_SESSION)||localStorage.getItem(GH_TOKEN_LOCAL)||''}
function setGhToken(v){v=(v||'').trim();if(v)sessionStorage.setItem(GH_TOKEN_SESSION,v);else sessionStorage.removeItem(GH_TOKEN_SESSION);if(cloudCfg.rememberToken&&v)localStorage.setItem(GH_TOKEN_LOCAL,v);else localStorage.removeItem(GH_TOKEN_LOCAL)}
function ensureStateMeta(){state.meta=state.meta||{};state.meta.version='v3.1-cloud';if(!state.meta.lastModifiedAt)state.meta.lastModifiedAt=new Date().toISOString()}
ensureStateMeta();
function setSaveStatus(msg='✓ 已保存'){const s=document.getElementById('saveStatus');if(s){s.textContent=msg;if(msg.includes('已保存'))setTimeout(()=>{if(s.textContent===msg)s.textContent='本地自动保存'},1100)}}
function cloudLog(msg){cloudLogLines.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);cloudLogLines=cloudLogLines.slice(0,20);const el=document.getElementById('cloudLog');if(el)el.textContent=cloudLogLines.join('\n')}
function setCloudStatus(kind='idle',text='GitHub 未连接'){cloudCfg.status=kind;saveCloudCfg();const el=document.getElementById('cloudStatus');if(el){el.textContent=text;el.style.color=kind==='ok'?'#15803d':kind==='busy'?'#1d4ed8':kind==='warn'?'#b45309':kind==='err'?'#b91c1c':''}const dot=document.getElementById('dcCloudDot');if(dot)dot.className='cloud-dot '+(kind==='ok'?'ok':kind==='busy'?'busy':kind==='warn'?'warn':kind==='err'?'err':'');const txt=document.getElementById('dcCloudText');if(txt)txt.textContent=text}
function simpleHash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)+'-'+str.length}
function save(reason='自动保存'){ensureStateMeta();state.meta.lastModifiedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));setSaveStatus('✓ 已保存');scheduleSnapshot(reason);scheduleCloudSync()}
let st;function autosave(){clearTimeout(st);st=setTimeout(()=>save('自动保存'),180)}
function persistPulledState(remoteState){state=remoteState;ensureStateMeta();localStorage.setItem(KEY,JSON.stringify(state));setSaveStatus('✓ 已拉取到本机')}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fit(p){let a=0,b=0;Object.entries(state.weights).forEach(([k,w])=>{a+=(+p.fitDims?.[k]||0)*(+w||0);b+=(+w||0)});return b?Math.round(a/b):0}
function tierClass(x){return 'tier-'+(x||'备')}
function recClass(p){return 'rec-'+(p.recruitClass||'unknown')}
function fundClass(p){return 'fund-'+(p.fundingClass||'unknown')}
function city(p){return state.cities[p.city]||{}}
function linkButtons(p){let out='';const labels={admission:'申请/项目官网',lab:'课题组',faculty:'导师官方页',funding:'Funding'};Object.entries(p.links||{}).forEach(([k,u])=>{if(u)out+=`<a class="linkbtn" href="${esc(u)}" target="_blank" rel="noopener">${labels[k]||k} ↗</a>`});return out}
function bindStatic(root=document){root.querySelectorAll('[data-static-key]').forEach(el=>{const k=el.dataset.staticKey;if(state.staticEdits[k]!=null)el.innerHTML=state.staticEdits[k];el.contentEditable='true';el.classList.add('editable');el.onblur=()=>{state.staticEdits[k]=el.innerHTML;autosave()}})}

/* ===== IndexedDB Local Version History ===== */
function openSnapDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(SNAP_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(SNAP_STORE))db.createObjectStore(SNAP_STORE,{keyPath:'id',autoIncrement:true})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function createLocalSnapshot(reason='手动快照'){try{const payload=JSON.stringify(state),sig=simpleHash(payload),last=localStorage.getItem(SNAP_SIG_KEY);if(sig===last&&reason!=='手动快照')return;const db=await openSnapDB();await new Promise((resolve,reject)=>{const tx=db.transaction(SNAP_STORE,'readwrite');tx.objectStore(SNAP_STORE).add({at:new Date().toISOString(),reason,sig,size:payload.length,data:payload});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});localStorage.setItem(SNAP_SIG_KEY,sig);lastSnapshotAt=Date.now();await pruneSnapshots(80);cloudLog(`本地版本已记录：${reason}`);if(document.getElementById('localHistory'))refreshLocalHistory()}catch(e){console.warn('snapshot failed',e)}}
function scheduleSnapshot(reason='自动保存'){clearTimeout(snapshotTimer);const wait=Math.max(1800,30000-(Date.now()-lastSnapshotAt));snapshotTimer=setTimeout(()=>createLocalSnapshot(reason),wait)}
async function pruneSnapshots(limit=80){const db=await openSnapDB();const keys=await new Promise((resolve,reject)=>{const tx=db.transaction(SNAP_STORE,'readonly'),r=tx.objectStore(SNAP_STORE).getAllKeys();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(keys.length<=limit)return;await new Promise((resolve,reject)=>{const tx=db.transaction(SNAP_STORE,'readwrite'),s=tx.objectStore(SNAP_STORE);keys.slice(0,keys.length-limit).forEach(k=>s.delete(k));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getSnapshots(){const db=await openSnapDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(SNAP_STORE,'readonly'),r=tx.objectStore(SNAP_STORE).getAll();r.onsuccess=()=>resolve(r.result.reverse());r.onerror=()=>reject(r.error)})}
async function getSnapshot(id){const db=await openSnapDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(SNAP_STORE,'readonly'),r=tx.objectStore(SNAP_STORE).get(+id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function restoreSnapshot(id){const rec=await getSnapshot(id);if(!rec)return;if(!confirm(`恢复到 ${fmtDate(rec.at)} 的本地版本？\n当前状态会先保存在本地历史中。`))return;await createLocalSnapshot('恢复前自动备份');state=JSON.parse(rec.data);save('恢复历史版本');renderAll();show('datacenter')}
async function downloadSnapshot(id){const rec=await getSnapshot(id);if(!rec)return;downloadText(rec.data,`phd-planner-snapshot-${rec.at.slice(0,19).replaceAll(':','-')}.json`)}
function fmtBytes(n){if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1024/1024).toFixed(2)+' MB'}
function fmtDate(x){if(!x)return'—';try{return new Date(x).toLocaleString()}catch(e){return x}}
function downloadText(txt,name){const b=new Blob([txt],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function refreshLocalHistory(){const el=document.getElementById('localHistory');if(!el)return;try{const rows=await getSnapshots();el.innerHTML=rows.length?rows.slice(0,30).map(r=>`<div class="history-item"><div class="history-main"><div class="history-title">${esc(r.reason||'自动版本')}</div><div class="history-meta">${fmtDate(r.at)} · ${fmtBytes(r.size||0)} · <span class="mono">${esc(r.sig||'')}</span></div></div><div class="toolbar"><button class="btn" onclick="downloadSnapshot(${r.id})">下载</button><button class="btn" onclick="restoreSnapshot(${r.id})">恢复</button></div></div>`).join(''):'<div class="info">还没有本地历史。网页编辑后会自动建立版本，也可以点“立即建立快照”。</div>'}catch(e){el.innerHTML=`<div class="callout">本地版本库读取失败：${esc(e.message)}</div>`}}

/* ===== GitHub REST Sync ===== */
function setCloudCfgField(k,v){cloudCfg[k]=v;saveCloudCfg();if(k==='autoSync'){nav();if(v)scheduleCloudSync()}renderCloudSummary()}
function toggleRememberToken(on){cloudCfg.rememberToken=!!on;saveCloudCfg();const t=getGhToken();if(on&&t)localStorage.setItem(GH_TOKEN_LOCAL,t);else localStorage.removeItem(GH_TOKEN_LOCAL);renderCloudSummary()}
function clearGhToken(){sessionStorage.removeItem(GH_TOKEN_SESSION);localStorage.removeItem(GH_TOKEN_LOCAL);setCloudStatus('idle','GitHub 未连接');renderDataCenter()}
function cloudReady(){return !!(cloudCfg.owner&&cloudCfg.repo&&cloudCfg.branch&&cloudCfg.path&&getGhToken())}
function ghHeaders(){const t=getGhToken();return {'Accept':'application/vnd.github+json','Authorization':`Bearer ${t}`,'X-GitHub-Api-Version':GH_API_VERSION,'Content-Type':'application/json'}}
function ghPath(){return cloudCfg.path.split('/').filter(Boolean).map(encodeURIComponent).join('/')}
async function ghFetch(url,opt={}){if(!getGhToken())throw new Error('还没有填写 GitHub Token');const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},ghHeaders(),opt.headers||{})}));if(r.status===204)return null;let body=null;try{body=await r.json()}catch(e){}if(!r.ok){const msg=body?.message||`${r.status} ${r.statusText}`;const err=new Error(msg);err.status=r.status;throw err}return body}
function b64EncodeUnicode(str){const bytes=new TextEncoder().encode(str);let binary='';const step=0x8000;for(let i=0;i<bytes.length;i+=step)binary+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(binary)}
function b64DecodeUnicode(b64){const clean=(b64||'').replace(/\s/g,''),binary=atob(clean),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new TextDecoder().decode(bytes)}
function makeEnvelope(localState){return {schema:'phd-planner-state-v1',appVersion:'v3.1-cloud',updatedAt:localState.meta?.lastModifiedAt||new Date().toISOString(),deviceId:getDeviceId(),state:localState}}
function parseEnvelope(txt){const obj=JSON.parse(txt);if(obj&&obj.schema==='phd-planner-state-v1'&&obj.state)return {state:obj.state,updatedAt:obj.updatedAt,deviceId:obj.deviceId};return {state:obj,updatedAt:obj?.meta?.lastModifiedAt||'',deviceId:''}}
async function ghRepoInfo(){return await ghFetch(`${GH_API}/repos/${encodeURIComponent(cloudCfg.owner)}/${encodeURIComponent(cloudCfg.repo)}`)}
async function ghGetFile(ref=''){const url=`${GH_API}/repos/${encodeURIComponent(cloudCfg.owner)}/${encodeURIComponent(cloudCfg.repo)}/contents/${ghPath()}${ref?`?ref=${encodeURIComponent(ref)}`:`?ref=${encodeURIComponent(cloudCfg.branch)}`}`;try{const j=await ghFetch(url);return {sha:j.sha,html_url:j.html_url,content:b64DecodeUnicode(j.content||''),raw:j}}catch(e){if(e.status===404)return null;throw e}}
async function testGithubConnection(){if(!cloudReady()){setCloudStatus('warn','请先填写 GitHub 配置');return alert('请填写 GitHub 用户名、数据仓库、branch、数据文件路径和 Token。')}setCloudStatus('busy','正在测试 GitHub…');try{const info=await ghRepoInfo(),remote=await ghGetFile();cloudLog(`连接成功：${info.full_name} (${info.private?'Private':'Public'})`);if(!info.private)cloudLog('提醒：当前数据仓库是 Public，私人申请数据会公开。建议改用单独 Private 数据仓库。');if(remote){cloudLog(`检测到远端数据文件：${cloudCfg.path}`);if(!cloudCfg.lastRemoteSha)setCloudStatus('warn','已连接 · 远端已有数据，请先拉取')}else setCloudStatus('ok','已连接 · 可首次同步');renderCloudSummary()}catch(e){setCloudStatus('err','GitHub 连接失败');cloudLog(`连接失败：${e.message}`);alert('连接失败：'+e.message)}}
async function pushGithub(force=false,reason='手动同步'){if(cloudBusy)return;if(!cloudReady())throw new Error('GitHub 同步配置不完整');cloudBusy=true;setCloudStatus('busy','GitHub 同步中…');try{const remote=await ghGetFile();if(remote&&!force){if(!cloudCfg.lastRemoteSha){const er=new Error('远端已经存在数据，但这台设备还没有同步基线。请先“从 GitHub 拉取”，避免覆盖。');er.code='REMOTE_EXISTS_FIRST';throw er}if(remote.sha!==cloudCfg.lastRemoteSha){const er=new Error('GitHub 上出现了这台设备不知道的新版本。为避免覆盖，自动同步已暂停；请先拉取/查看版本历史。');er.code='REMOTE_CONFLICT';throw er}}
const localCopy=clone(state),payload=JSON.stringify(makeEnvelope(localCopy),null,2),body={message:`PhD Planner ${reason} · ${new Date().toLocaleString()}`,content:b64EncodeUnicode(payload),branch:cloudCfg.branch};if(remote)body.sha=remote.sha;const result=await ghFetch(`${GH_API}/repos/${encodeURIComponent(cloudCfg.owner)}/${encodeURIComponent(cloudCfg.repo)}/contents/${ghPath()}`,{method:'PUT',body:JSON.stringify(body)});cloudCfg.lastRemoteSha=result?.content?.sha||'';cloudCfg.lastCommitSha=result?.commit?.sha||'';cloudCfg.lastSyncAt=new Date().toISOString();cloudCfg.lastSyncedLocalModifiedAt=localCopy.meta?.lastModifiedAt||'';saveCloudCfg();setCloudStatus('ok','✓ GitHub 已同步');cloudLog(`已同步到 ${cloudCfg.repo}/${cloudCfg.path}`);renderCloudSummary();if(document.getElementById('gitHistory'))refreshGitHistory()}catch(e){if(e.code==='REMOTE_CONFLICT'||e.code==='REMOTE_EXISTS_FIRST')setCloudStatus('warn','⚠ 远端有新版本');else setCloudStatus('err','GitHub 同步失败');cloudLog(`同步失败：${e.message}`);throw e}finally{cloudBusy=false}}
async function syncNowManual(){try{await createLocalSnapshot('手动同步前快照');await pushGithub(false,'手动同步')}catch(e){if(e.code==='REMOTE_EXISTS_FIRST'){if(confirm(e.message+'\n\n仍然强制用本机数据覆盖远端吗？'))await pushGithub(true,'首次强制覆盖')}else if(e.code==='REMOTE_CONFLICT'){if(confirm(e.message+'\n\n建议先拉取。若你确定 GitHub 远端不需要保留，可以强制覆盖。是否继续强制覆盖？'))await pushGithub(true,'冲突后强制覆盖')}else alert('同步失败：'+e.message)}}
async function pullGithub(ref='',historical=false){if(!cloudReady())return alert('请先完成 GitHub 同步配置。');setCloudStatus('busy','正在从 GitHub 拉取…');try{const remote=await ghGetFile(ref);if(!remote)throw new Error('GitHub 数据文件不存在');const parsed=parseEnvelope(remote.content);if(!parsed.state||!parsed.state.projects)throw new Error('远端文件不是有效的申博管理器数据');if(!confirm(`${historical?'恢复这个 GitHub 历史版本':'从 GitHub 拉取最新数据'}？\n当前本机状态会先自动保存一个快照。`)){setCloudStatus('idle','已取消拉取');return}await createLocalSnapshot('GitHub 拉取前备份');if(historical){parsed.state.meta=parsed.state.meta||{};parsed.state.meta.lastModifiedAt=new Date().toISOString()}persistPulledState(parsed.state);if(!historical){cloudCfg.lastRemoteSha=remote.sha;cloudCfg.lastSyncAt=new Date().toISOString();cloudCfg.lastSyncedLocalModifiedAt=state.meta?.lastModifiedAt||'';saveCloudCfg()}await createLocalSnapshot(historical?'恢复GitHub历史版本':'从GitHub拉取');renderAll();setCloudStatus(historical?'warn':'ok',historical?'已恢复历史版本 · 待同步':'✓ 已拉取 GitHub 最新数据');cloudLog(historical?'已恢复GitHub历史版本到本机':'已从GitHub拉取最新数据');show('datacenter')}catch(e){setCloudStatus('err','GitHub 拉取失败');cloudLog(`拉取失败：${e.message}`);alert('拉取失败：'+e.message)}}
let cloudSyncDebounceAt=0;
function scheduleCloudSync(){if(!cloudCfg.autoSync||!cloudReady())return;clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{try{await pushGithub(false,'自动同步')}catch(e){/* status already shown */}},15000)}
async function refreshGitHistory(){const el=document.getElementById('gitHistory');if(!el)return;if(!cloudReady()){el.innerHTML='<div class="info">完成 GitHub 配置后，可在这里查看远端 commit 版本历史。</div>';return}el.innerHTML='<div class="info">正在读取 GitHub 版本历史…</div>';try{const q=new URLSearchParams({sha:cloudCfg.branch,path:cloudCfg.path,per_page:'30'}),rows=await ghFetch(`${GH_API}/repos/${encodeURIComponent(cloudCfg.owner)}/${encodeURIComponent(cloudCfg.repo)}/commits?${q}`);el.innerHTML=rows.length?rows.map(c=>`<div class="history-item"><div class="history-main"><div class="history-title">${esc(c.commit?.message||'GitHub version')}</div><div class="history-meta">${fmtDate(c.commit?.committer?.date)} · <span class="mono">${esc(c.sha.slice(0,10))}</span></div></div><div class="toolbar"><a class="btn" href="${esc(c.html_url)}" target="_blank" rel="noopener" style="text-decoration:none">GitHub</a><button class="btn" onclick="pullGithub('${c.sha}',true)">恢复</button></div></div>`).join(''):'<div class="info">这个数据文件还没有 GitHub commit 历史。</div>'}catch(e){el.innerHTML=`<div class="callout">GitHub 历史读取失败：${esc(e.message)}</div>`}}
function renderCloudSummary(){const el=document.getElementById('cloudSummary');if(!el)return;const localTime=state.meta?.lastModifiedAt?fmtDate(state.meta.lastModifiedAt):'—',syncTime=cloudCfg.lastSyncAt?fmtDate(cloudCfg.lastSyncAt):'尚未同步';el.innerHTML=`<div class="auto-stat"><div class="mini-stat"><b>${cloudCfg.autoSync?'ON':'OFF'}</b><div>GitHub 自动同步</div></div><div class="mini-stat"><b>${cloudCfg.lastRemoteSha?cloudCfg.lastRemoteSha.slice(0,7):'—'}</b><div>远端数据 SHA</div></div><div class="mini-stat"><b>${fmtBytes(JSON.stringify(state).length)}</b><div>当前数据体积</div></div><div class="mini-stat"><b>${esc((cloudCfg.repo||'—').slice(0,18))}</b><div>数据仓库</div></div><div class="mini-stat"><b>${getGhToken()?'✓':'—'}</b><div>Token 状态</div></div></div><div class="info" style="margin-top:8px">本机最近修改：${localTime}<br>最近 GitHub 同步：${syncTime}</div>`}
function renderDataCenter(){const el=document.getElementById('datacenter');if(!el)return;const token=getGhToken();el.innerHTML=`
